# Đặt file này ở thư mục cha, cạnh source/ (code), qwen-4b/ (model vLLM), docling-layout-heron/.
# Chạy ngay trong thư mục code thì đặt SOURCE_DIR=. trong .env.
# API (cổng 8002):
#   docker compose up -d --build api      → POST http://localhost:8002/ocr
#   docker compose logs -f api
# Chạy batch 1 file hoặc cả thư mục (không qua API; file nằm trong source/):
#   docker compose run --rm --entrypoint python api main.py input/a.pdf
#   ./run_ocr.sh /duong/dan/file_hoac_thu_muc     (file ở bất kỳ đâu trên máy)
# Chạy kèm vLLM trong compose (cần GPU NVIDIA + nvidia-container-toolkit):
#   docker compose --profile vllm up -d vllm  (rồi đặt QWEN_OCR_BASE_URL=http://vllm:8007/v1)
services:
  # API HTTP (api.py)
  api:
    build: .
    image: ocr-gpkd
    container_name: ocr-gpkd
    environment:
      QWEN_OCR_BASE_URL: ${QWEN_OCR_BASE_URL:-http://host.docker.internal:8007/v1}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL:-qwen-ocr}
      QWEN_OCR_API_KEY: ${QWEN_OCR_API_KEY:-EMPTY}
      # logger.py: log ghi vào source/logs/ocr.log, xoay vòng mỗi ngày.
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Code mount từ máy 
      - ${SOURCE_DIR:-./source}:/app
      # Model docling-layout-heron đã tải sẵn 
      - ${HERON_MODEL_DIR:-./docling-layout-heron}:/app/docling-layout-heron:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python", "run_api.py"]
    ports:
      - "${API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    container_name: vllm-qwen-ocr
    image: vllm/vllm-openai:latest
    command: >
      --model /models/qwen
      --served-model-name ${QWEN_OCR_MODEL:-qwen-ocr}
      --port 8007
      --quantization bitsandbytes
      --gpu-memory-utilization 0.14
      --max-model-len 5120
      --max-num-seqs 5
      --compilation-config '{"cudagraph_mode": "PIECEWISE"}'
    ports:
      - "8007:8007"
    ipc: host
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    volumes:
      - ${VLLM_MODEL_DIR:-./qwen-4b}:/models/qwen:ro
    environment:
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
