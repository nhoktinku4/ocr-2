# Chạy API (vLLM chạy sẵn trên máy, cổng 8002):
#   docker compose up -d --build
# Chạy kèm vLLM trong compose (cần GPU NVIDIA + nvidia-container-toolkit):
#   VLLM_MODEL=<model Qwen trên Hugging Face> docker compose --profile vllm up -d --build
# API: http://<máy>:8000/docs
services:
  ocr-api:
    build: .
    image: ocr-gpkd
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      QWEN_OCR_BASE_URL: ${QWEN_OCR_BASE_URL:-http://host.docker.internal:8002/v1}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL:-qwen-ocr}
      QWEN_OCR_API_KEY: ${QWEN_OCR_API_KEY:-EMPTY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL:-}
      --served-model-name ${QWEN_OCR_MODEL:-qwen-ocr}
      --port 8002
    ports:
      - "8002:8002"
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
